# Keeps the desk's market data fresh and runs the exit rules while nobody is
# watching the dashboard.
#
# The dashboard syncs itself every 60 seconds whenever it is open, so this
# workflow only matters when it is closed — overnight, mostly, which is exactly
# when an unattended take-profit needs to fire.
#
# Vercel Cron on the Hobby plan is capped at one run per day, far too slow for a
# trading desk, so the real cadence comes from here. GitHub's scheduler has a
# 5-minute floor and runs late under load: treat it as best-effort. Upgrading
# Vercel to Pro allows `* * * * *` in vercel.json, and this file can then go.
name: sync markets

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:            # lets you trigger a sync by hand from the Actions tab

concurrency:
  group: market-sync
  cancel-in-progress: false     # never cut a sync short; skip instead

env:
  # The backend URL is public, so it lives here as a default rather than a secret.
  # Override it with a DEPLOY_URL repository variable or secret if the deployment
  # ever moves.
  URL: ${{ secrets.DEPLOY_URL || vars.DEPLOY_URL || 'https://kalshi-trading-platform-backend.vercel.app' }}
  SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        run: |
          # Missing credentials are a setup gap, not a broken build. This used to
          # exit 1, which mailed a red "All jobs have failed" notice every five
          # minutes for a workflow that had simply never been configured.
          if [ -z "$SECRET" ]; then
            echo "::notice::CRON_SECRET is not set, so background sync is off."
            echo
            echo "The dashboard still syncs itself every 60s while it is open."
            echo "What this adds is syncing — and auto-selling — while it is closed."
            echo
            echo "To switch it on, set the repository secret CRON_SECRET to the"
            echo "same value as CRON_SECRET in the backend's Vercel environment:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 0
          fi

          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 \
            -X POST "$URL/api/sync" \
            -H "Authorization: Bearer $SECRET")

          echo "HTTP $code"
          cat response.json
          echo

          if [ "$code" != "200" ]; then
            echo "::error::sync failed with HTTP $code"
            exit 1
          fi

      - name: Reconcile open orders
        if: success() && env.SECRET != ''
        run: |
          curl -sS --max-time 60 -X POST "$URL/api/trades/reconcile" \
            -H "Authorization: Bearer $SECRET" || true
          echo
