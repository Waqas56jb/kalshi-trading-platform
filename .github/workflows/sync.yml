# Keeps the desk's market data fresh.
#
# Vercel Cron on the Hobby plan is limited to one run per day, which is far too
# slow for a trading desk, so the real cadence comes from here instead. GitHub's
# scheduler has a 5-minute floor and can run late under load — treat this as
# best-effort. Upgrading Vercel to Pro allows `* * * * *` in vercel.json and this
# workflow can then be deleted.
name: sync markets

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:            # lets you trigger a sync by hand from the Actions tab

concurrency:
  group: market-sync
  cancel-in-progress: false     # never cut a sync short; skip instead

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        env:
          URL: ${{ secrets.DEPLOY_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::DEPLOY_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 \
            -X POST "$URL/api/sync" \
            -H "Authorization: Bearer $SECRET")

          echo "HTTP $code"
          cat response.json
          echo

          if [ "$code" != "200" ]; then
            echo "::error::sync failed with HTTP $code"
            exit 1
          fi

      - name: Reconcile open orders
        if: success()
        env:
          URL: ${{ secrets.DEPLOY_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 60 -X POST "$URL/api/trades/reconcile" \
            -H "Authorization: Bearer $SECRET" || true
          echo
